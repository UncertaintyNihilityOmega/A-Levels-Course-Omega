# Check every course, build the guide and publish site/ to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Check, build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tools (maths-font subset)
        run: pip install fonttools brotli
      - run: npm ci
      - name: Check every chapter (lint, marks, links, number checks)
        run: node engine/check.js --py
      - name: Build the site
        run: node engine/build.js --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
